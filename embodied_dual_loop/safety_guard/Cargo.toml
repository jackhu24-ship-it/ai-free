[package]
name = "safety_guard"
version = "0.1.0"
edition = "2021"
authors = ["Embodied AI Safety Core Team"]
description = "Neuro-Symbolic Fast-Loop Control Barrier Function (CBF) Safety Guard with Lock-Free SPSC Seqlock"
license = "Apache-2.0"

[lib]
name = "safety_guard"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false
strip = true

[features]
default = ["std"]
std = []
no_std = []

[dependencies]
