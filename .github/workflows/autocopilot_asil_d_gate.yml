name: AutoCopilot ASIL-D Safety Gate & Regression Pipeline

on:
  push:
    branches: [ main, begin_development ]
    paths:
      - 'auto_copilot/**'
      - '.github/workflows/autocopilot_asil_d_gate.yml'
  pull_request:
    branches: [ main, begin_development ]
    paths:
      - 'auto_copilot/**'

jobs:
  safety-gate-verification:
    name: ISO 26262 ASIL-D Verification Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Automotive & Verification Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-can dataclasses-json pycryptodome

      - name: Step 1 - ISO 26262-6 MC/DC Unit Verification
        run: |
          echo "Executing MC/DC Branch Coverage Test Suite..."
          python -m pytest -p no:asyncio auto_copilot/test_safety_mcdc.py -v

      - name: Step 2 - HIL Vehicle Matrix & Shadow Mode Verification
        run: |
          echo "Executing HIL Vehicle Matrix & Zero-TX Tests..."
          python -m pytest -p no:asyncio auto_copilot/test_hil_vehicle_matrix.py -v

      - name: Step 3 - CAN-FD E2E & 40ms FTTI Dynamic Verification
        run: |
          echo "Executing E2E CRC-8 & Actuator FTTI Cutoff Tests..."
          python -m pytest -p no:asyncio auto_copilot/test_e2e_ftti_validator.py -v

      - name: Step 4 - Fleet Telemetry 200ms Blackbox Pre-Trigger Test
        run: |
          echo "Verifying Fleet Telemetry Blackbox Snapshot Engine..."
          python auto_copilot/fleet_telemetry_blackbox.py

      - name: Step 5 - Bundle ISO 26262 Safety Case Dossier
        run: |
          echo "Executing Safety Case Dossier Bundler..."
          python auto_copilot/safety_case_bundler.py

      - name: Step 6 - Archive Safety Case Bundle
        uses: actions/upload-artifact@v4
        with:
          name: safety-case-bundle-asil-d
          path: |
            auto_copilot/safety_case_bundle.zip
            auto_copilot/safety_case_manifest.json
          retention-days: 90
