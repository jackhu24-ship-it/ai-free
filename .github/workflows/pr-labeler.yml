name: Auto Label PR by Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: write
  issues: write

jobs:
  label-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Type and Apply Label
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^([a-zA-Z0-9_-]+)(\(.*\))?!?:\s*.+/);
            if (!match) {
              console.log(`標題未符合 Conventional 前綴格式: "${title}"，跳過打標籤。`);
              return;
            }
            const type = match[1].toLowerCase();
            const labelMap = {
              'feat': 'feature',
              'fix': 'bug',
              'test': 'testing',
              'docs': 'documentation',
              'refactor': 'refactor',
              'ci': 'ci/cd',
              'chore': 'chore',
              'perf': 'performance'
            };
            const targetLabel = labelMap[type];
            if (!targetLabel) {
              console.log(`未設定對應標籤的前綴: "${type}"`);
              return;
            }
            const currentLabels = context.payload.pull_request.labels.map(l => l.name);
            if (currentLabels.includes(targetLabel)) {
              console.log(`標籤 "${targetLabel}" 已存在於 PR 中。`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [targetLabel]
            });
            console.log(`成功將標籤 "${targetLabel}" 加至 PR #${context.payload.pull_request.number}`);
