name: Add New Issue to Project

on:
  issues:
    types:
      - opened
  pull_request_target:
    types:
      - opened

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to GitHub Project (When configured)
        if: vars.PROJECT_URL != '' && secrets.PROJECT_PAT != ''
        uses: actions/add-to-project@v1
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_PAT }}

      - name: Standby Notice (When unconfigured)
        if: vars.PROJECT_URL == '' || secrets.PROJECT_PAT == ''
        run: |
          echo "ℹ️ [STANDBY] 尚未配置 PROJECT_URL 或 PROJECT_PAT，安全略過專案看板自動關聯。"
          echo "💡 如需啟用：請至 Repo Settings -> Secrets/Variables 設定 PROJECT_URL 與 PROJECT_PAT。"
