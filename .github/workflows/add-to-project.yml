name: Add New Issue to Project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to GitHub Project
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/ORG_OR_USER/projects/PROJECT_NUMBER
          github-token: ${{ secrets.PROJECT_PAT }}
