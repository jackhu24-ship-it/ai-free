name: Sync WIP Label and Draft Status

on:
  pull_request_target:
    types:
      - labeled
      - ready_for_review

permissions:
  pull-requests: write
  issues: write

jobs:
  handle-draft-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Convert to Draft on WIP label
        if: |
          github.event.action == 'labeled' &&
          contains(fromJSON('["wip","WIP","work-in-progress"]'), github.event.label.name) &&
          github.event.pull_request.draft == false
        uses: actions/github-script@v7
        with:
          script: |
            const prId = context.payload.pull_request.node_id;
            const query = `
              mutation ConvertToDraft($input: ConvertPullRequestToDraftInput!) {
                convertPullRequestToDraft(input: $input) {
                  pullRequest {
                    id
                  }
                }
              }
            `;
            try {
              await github.graphql(query, {
                input: {
                  pullRequestId: prId
                }
              });
              console.log(`成功將 PR #${context.payload.pull_request.number} 轉為 Draft！`);
            } catch (err) {
              console.warn('轉換 Draft 失敗或無權限:', err.message);
            }

      - name: Remove WIP label on ready_for_review
        if: github.event.action == 'ready_for_review'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const labelsToRemove = ['wip', 'WIP', 'work-in-progress'];
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: prNumber,
                  name: label
                });
                console.log(`已從 PR #${prNumber} 移除標籤: ${label}`);
              } catch (e) {
                // 若標籤本來就不存在則略過
              }
            }
