name: CI Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff Lint Check
        run: |
          ruff check tests/test_stellaris_portfolio.py tests/test_pipeline_sanity.py

      - name: Run Ruff Format Check
        run: |
          ruff format --check tests/test_stellaris_portfolio.py tests/test_pipeline_sanity.py

      - name: Run Unit Tests & Coverage
        run: |
          pytest tests/test_stellaris_portfolio.py --cov=stellaris_portfolio --cov-report=term-missing
