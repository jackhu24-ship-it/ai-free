name: ?? Bug 回報
description: 回報系統異常、錯誤或非預期行為
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        感謝提交 Bug！請完整填寫以下資訊，以協助快速定位問題。
  - type: textarea
    id: description
    attributes:
      label: 問題描述
      description: 請說明發生的異常行為或錯誤訊息。
      placeholder: 例：在輸入 oo 時，程式崩潰…
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請列出讓問題發生的逐步操作。
      placeholder: |
        1. 點擊「設定」>「匯入」
        2. 輸入 bc 並按下「確定」
        3. 發生錯誤…
  - type: textarea
    id: expected
    attributes:
      label: 預期結果
      description: 正常情況下應該要發生的行為。
  - type: textarea
    id: environment
    attributes:
      label: 環境資訊
      description: 請提供作業系統、Python 版本、相關套件版本等資訊。
      placeholder: Windows 10 / Python 3.12.4 / numpy 2.0.0
  - type: input
    id: pr-link
    attributes:
      label: 相關 PR（如果有）
      description: 若已建立對應的 PR，貼上連結。
