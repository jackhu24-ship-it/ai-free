<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級文字雲</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      background: linear-gradient(160deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }
    .wrap { max-width: 900px; margin: 0 auto; }
    header {
      text-align: center;
      color: #fff;
      padding: 12px 0 20px;
    }
    header h1 { font-size: 2rem; letter-spacing: 2px; }
    header p { opacity: .85; margin-top: 6px; font-size: .95rem; }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,.18);
      padding: 20px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 12px; color: #4a4a8a; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color .2s;
    }
    input:focus, textarea:focus { border-color: #667eea; }
    input { max-width: 160px; }
    textarea { resize: vertical; min-height: 80px; }
    .btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 1.05rem;
      cursor: pointer;
      font-family: inherit;
      transition: transform .15s, opacity .2s;
      align-self: flex-end;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .stat {
      background: #f0f2ff;
      border-radius: 10px;
      padding: 8px 18px;
      font-size: .95rem;
      color: #4a4a8a;
    }
    .stat b { font-size: 1.2rem; }
    #msg { font-size: .9rem; min-height: 1.4em; margin-top: 10px; }
    #msg.ok { color: #2e7d32; }
    #msg.err { color: #c62828; }
    #cloud { width: 100%; height: 420px; border: 2px dashed #e0e0e0; border-radius: 12px; background: #fafbff; }
    .note { font-size: .8rem; color: #999; text-align: center; margin-top: 10px; }
    footer { text-align: center; color: rgba(255,255,255,.8); font-size: .8rem; padding: 10px 0 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>☁️ 班級文字雲</h1>
      <p>輸入你的座號與想法，即時看看大家的詞彙雲</p>
    </header>

    <div class="card">
      <h2>✏️ 我的想法</h2>
      <div class="row">
        <input id="seat" type="text" inputmode="numeric" placeholder="座號（可留空）" maxlength="10">
        <textarea id="word" placeholder="輸入詞彙，多個詞用「空白」或「，」分隔，例如：有趣 好玩 有收穫" style="flex:1"></textarea>
        <button class="btn" id="send">送出</button>
      </div>
      <div id="msg"></div>
    </div>

    <div class="card">
      <h2>🌥️ 大家的文字雲</h2>
      <div class="stats">
        <div class="stat">👥 參與人數 <b id="nPeople">0</b></div>
        <div class="stat">📝 詞彙總數 <b id="nWords">0</b></div>
      </div>
      <canvas id="cloud"></canvas>
      <p class="note">文字大小代表出現次數，送出後立即更新</p>
    </div>

    <footer>AI 教學工具鏈 demo・Supabase + WordCloud2</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.1/src/wordcloud2.js"></script>
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://jbnznfrnzcjeuminiwak.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_pZFPZ1KGQvTLN6YwnQLd5A_dlWANhUW";

    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    const canvas = document.getElementById("cloud");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("send");
    const COLORS = ["#667eea", "#764ba2", "#e91e63", "#ff9800", "#009688", "#3f51b5", "#f44336", "#795548"];

    let allWords = [];
    let pending = false;

    function setMsg(text, isErr = false) {
      msg.textContent = text;
      msg.className = isErr ? "err" : "ok";
    }

    async function loadWords() {
      const { data, error } = await supabase
        .from("wordcloud")
        .select("seat_no, word");
      if (error) { setMsg("讀取失敗：" + error.message, true); return; }
      allWords = data || [];
      drawCloud();
      updateStats();
    }

    function updateStats() {
      const people = new Set(allWords.map(w => w.seat_no).filter(Boolean));
      document.getElementById("nPeople").textContent = people.size;
      document.getElementById("nWords").textContent = allWords.length;
    }

    function drawCloud() {
      const count = {};
      allWords.forEach(w => { count[w.word] = (count[w.word] || 0) + 1; });
      const list = Object.entries(count).map(([word, c]) => [word, c]);

      if (list.length === 0) {
        clearCanvas();
        return;
      }

      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(rect.width, 200);
      canvas.height = 420;

      WordCloud(canvas, {
        list,
        gridSize: 8,
        weightFactor: (w) => Math.pow(w, 0.8) * 22,
        fontFamily: '"Microsoft JhengHei", "Noto Sans TC", sans-serif',
        color: () => COLORS[Math.floor(Math.random() * COLORS.length)],
        backgroundColor: "#fafbff",
        rotateRatio: 0.3,
        minSize: 12,
        weightMode: "normal"
      });
    }

    function clearCanvas() {
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    async function submit() {
      const wordText = document.getElementById("word").value.trim();
      if (!wordText) { setMsg("請先輸入詞彙", true); return; }
      const seat = document.getElementById("seat").value.trim();

      const words = wordText.split(/[\s,，、;；]+/).filter(Boolean);
      if (words.length === 0) { setMsg("沒有有效的詞彙", true); return; }

      pending = true;
      btn.disabled = true;

      const rows = words.map(word => ({ seat_no: seat || null, word }));
      const { error } = await supabase.from("wordcloud").insert(rows);

      if (error) {
        setMsg("送出失敗：" + error.message, true);
      } else {
        setMsg(`✅ 已送出 ${words.length} 個詞彙！`);
        document.getElementById("word").value = "";
        await loadWords();
      }
      pending = false;
      btn.disabled = false;
    }

    btn.addEventListener("click", submit);
    document.getElementById("word").addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
    });

    window.addEventListener("resize", () => { if (allWords.length) drawCloud(); });

    const channel = supabase
      .channel("wordcloud-live")
      .on("postgres_changes", { event: "*", schema: "public", table: "wordcloud" }, () => {
        loadWords();
      })
      .subscribe();

    loadWords();
  </script>
</body>
</html>
