<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>教室 QR Code 列印頁</title>
<style>
  body { font-family: "Microsoft JhengHei", sans-serif; margin: 0; padding: 24px; }
  h1 { text-align: center; font-size: 22px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { border: 2px solid #333; border-radius: 12px; padding: 20px; text-align: center; page-break-inside: avoid; }
  .label { font-size: 26px; font-weight: bold; margin-bottom: 8px; }
  .url { font-size: 14px; color: #555; margin-top: 8px; word-break: break-all; }
  img { width: 100%; max-width: 420px; }
  @media print { body { padding: 0; } .card { border: 1px solid #999; } }
</style>
</head>
<body>
<h1>教室 QR Code（掃碼即用，無需登入）</h1>
<div class="grid">
<div class="card"><div class="label">班級文字雲</div><img src="class-wordcloud.svg" alt="班級文字雲 QR Code"><div class="url">https://class-wordcloud.netlify.app/</div></div>
<div class="card"><div class="label">問問 AI</div><img src="class-demo-jackhu24.svg" alt="問問 AI QR Code"><div class="url">https://class-demo-jackhu24.netlify.app/</div></div>
</div>
</body>
</html>
